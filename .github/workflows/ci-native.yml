name: Flask CI Native

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize SQLite database
        run: |
          python manage.py db upgrade || echo "Database ready"

      - name: Smoke test Flask server
        run: |
          nohup python manage.py runserver > flask.log 2>&1 &
          sleep 5
          curl -f -I http://127.0.0 || (cat flask.log && exit 1)
